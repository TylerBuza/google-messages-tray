name: Bug report
description: Report a reproducible problem using fictional messages only.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include real SMS text, OTPs, phone numbers, email addresses, pairing codes, cookies, or browser profiles. For security issues, use the private reporting link in SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Messages Tray version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows and Chrome versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: What did you do? Use made-up text/codes if needed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed real texts, account details, OTPs, and pairing artifacts.
          required: true
